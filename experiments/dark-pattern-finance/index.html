<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="모아핏 연구용 모바일 금융상품 선택 체험" />
    <title>모아핏 · 나의 금융상품 선택하기</title>
    <link rel="stylesheet" href="./app.css" />
    <script src="./panel-config.js" defer></script>
    <script src="./session-sync.js" defer></script>
    <script src="./panel-bridge.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <button class="wordmark" data-action="home" aria-label="모아핏 시작 화면">
          <span class="mark" aria-hidden="true">ㅁ</span><span>모아핏</span><span class="header-meta">금융상품</span>
        </button>
        <span class="status-chip">모의 체험</span>
      </header>
      <div id="progress" class="progress-wrap" aria-label="가입 진행 상황"></div>
      <div id="save-status" class="save-status" role="status" aria-live="polite"></div>
      <main id="screen" tabindex="-1"></main>
      <footer id="navigation" class="bottom-bar"></footer>
    </div>
    <div id="dialog-root"></div>
    <div id="announcer" class="sr-only" aria-live="polite"></div>
  </body>
</html>
