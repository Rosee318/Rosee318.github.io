<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#132d53" />
    <meta name="description" content="Morrow Finance 연구용 모바일 금융 의사결정 시뮬레이션" />
    <title>Morrow · 나의 금융 시작하기</title>
    <link rel="stylesheet" href="./app.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <button class="wordmark" data-action="home" aria-label="Morrow 시작 화면">
          <span class="mark" aria-hidden="true">m</span>morrow<span class="header-meta">FINANCE</span>
        </button>
        <span class="status-chip">모의 체험</span>
      </header>
      <div id="progress" class="progress-wrap" aria-label="가입 진행 상황"></div>
      <main id="screen" tabindex="-1"></main>
      <footer id="navigation" class="bottom-bar"></footer>
    </div>
    <div id="dialog-root"></div>
    <div id="announcer" class="sr-only" aria-live="polite"></div>
  </body>
</html>
